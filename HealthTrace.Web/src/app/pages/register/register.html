<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="w-full max-w-md mx-auto my-4 space-y-6 rounded-lg border border-gray-200 bg-white p-4 shadow-md sm:p-6">

  <img src="/images/healthtrace-logo.png" alt="HealthTrace" class="mx-auto mb-4 h-40 w-auto">

  <div>
    <p *ngIf="errorMessage" class="text-sm text-red-600">{{ errorMessage }}</p>
  </div>

  <div *ngIf="(validationErrors | keyvalue).length > 0" class="text-sm text-red-600">
    <p>Validation errors:</p>
    <ul>
      <li *ngFor="let errorGroup of validationErrors | keyvalue">
        <span>{{ errorGroup.key }}:</span>
        <ul>
          <li *ngFor="let message of errorGroup.value">{{ message }}</li>
        </ul>
      </li>
    </ul>
  </div>

  <div>
    <label for="username" class="mb-1 block text-sm font-medium text-gray-700">Username:</label>
    <input type="text" id="username" formControlName="username" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
  </div>

  <div>
    <label for="password" class="mb-1 block text-sm font-medium text-gray-700">Password:</label>
    <input type="password" id="password" formControlName="password" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
  </div>

  <div>
    <label for="passwordConfirmation" class="mb-1 block text-sm font-medium text-gray-700">Confirm Password:</label>
    <input type="password" id="passwordConfirmation" formControlName="passwordConfirmation" [class.border-red-500]="registerForm.hasError('passwordMismatch') && registerForm.get('passwordConfirmation')?.touched" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
    <p *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('passwordConfirmation')?.touched" class="mt-1 text-sm text-red-600">Passwords do not match.</p>
  </div>

  <div>
    <label for="firstName" class="mb-1 block text-sm font-medium text-gray-700">First Name:</label>
    <input type="text" id="firstName" formControlName="firstName" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
  </div>

  <div>
    <label for="lastName" class="mb-1 block text-sm font-medium text-gray-700">Last Name:</label>
    <input type="text" id="lastName" formControlName="lastName" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
  </div>

  <div>
    <label for="cf" class="mb-1 block text-sm font-medium text-gray-700">CF:</label>
    <input type="text" id="cf" formControlName="cf" [class.border-red-500]="registerForm.get('cf')?.invalid && registerForm.get('cf')?.touched" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
  </div>

  <div>
    <label for="birthDate" class="mb-1 block text-sm font-medium text-gray-700">Birth Date:</label>
    <input type="date" id="birthDate" formControlName="birthDate" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
  </div>

  <div>
    <label for="birthPlace" class="mb-1 block text-sm font-medium text-gray-700">Birth Place:</label>
    <input type="text" id="birthPlace" formControlName="birthPlace" class="w-full rounded-md border border-gray-300 px-3 py-2 text-gray-900 outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200">
  </div>

  <button class="w-full rounded-md bg-gradient-to-r from-[#0E7D73] to-[#3485BF] px-4 py-2 font-medium text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50" type="submit" [disabled]="registerForm.invalid">Register</button>

</form>
